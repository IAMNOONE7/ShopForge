name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: production
        type: environment

permissions:
  contents: read
  id-token: write

# A release migrates first, serves second and is verified third (D-205). The schema moves before the new image serves
# anywhere, and the build that answers through the edge is checked to be the release's own, frontends included: the
# image carries both and the app serves them (D-206).
jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One release at a time per environment: two would migrate and swap images over each other.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      LOCATION: ${{ vars.LOCATION }}
      REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
      REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
      REGISTRY_RESOURCE_GROUP: ${{ vars.REGISTRY_RESOURCE_GROUP }}
      STORE_HOST_SUFFIX: ${{ vars.STORE_HOST_SUFFIX }}
      ADMIN_HOST: ${{ vars.ADMIN_HOST }}
      FIRST_OPERATOR_EMAIL: ${{ vars.FIRST_OPERATOR_EMAIL }}
      SMOKE_STORE_HOST: ${{ vars.SMOKE_STORE_HOST }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
      MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
      IMAGE: ${{ vars.REGISTRY_SERVER }}/shopforge-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # A release missing an input, or one that would send no mail, stops before anything is built.
      - name: Check the release's inputs
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
        run: scripts/release-inputs.sh

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The image builds the frontends too, as CI builds them. The commit goes into the build's version, which is how
      # the smoke test knows the release's own build answered.
      - name: Build and push the image
        run: |
          az acr login --name "$REGISTRY_NAME"
          docker build --build-arg SOURCE_VERSION="${{ github.sha }}" --tag "$IMAGE" .
          docker push "$IMAGE"

      # Everything the release needs, including the job that migrates with its image, while the app keeps serving.
      - name: Prepare the environment, leaving the serving app alone
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
        run: scripts/provision.sh "$ENVIRONMENT" without-app

      # The release's own image migrates the schema from inside the environment, never by the app as it starts (D-074).
      - name: Migrate the schema
        run: scripts/migrate.sh "$ENVIRONMENT"

      # The new revision is ready only once it finds every migration it carries; the one it replaces serves until then.
      - name: Release the image
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
        run: scripts/provision.sh "$ENVIRONMENT" with-app

      # Nobody is told a deployment succeeded until the thing it deployed answers through the edge (D-125), as the
      # release's own build.
      - name: Smoke test the API
        run: scripts/release-smoke.sh "$ENVIRONMENT" "${{ github.sha }}" api

      # What a shopper and a merchant open, and the app refusing anybody who goes around the edge (D-206, D-207).
      - name: Smoke test the site
        run: scripts/release-smoke.sh "$ENVIRONMENT" "${{ github.sha }}" site
