name: shopforge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shopforge
      POSTGRES_USER: shopforge
      POSTGRES_PASSWORD: shopforge
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopforge -d shopforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
